language: python
python:
  - "3.12"
dist: jammy

before_install:
  # 1. Add the correct repository URL (note the /pub/repos/apt/ path)
  #    Remove any old/broken files
  #- sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
  
  # 2. Add the correct GPG key file
  #- wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc


  # 3. Update and install explicitly
  - sudo apt-get update
  
  # 2. Install version 17
  #- sudo apt-get install -y postgresql-17 postgresql-client-17 postgresql-contrib-17 postgis postgresql-17-postgis-3

install:
  - pip install -r requirements-dev.txt

services:
  - postgresql
addons:
  postgresql: "17"
apt:
  packages:
    - postgresql-17
    - postgresql-client-17
    - postgresql-contrib-17
    - postgis
    - postgresql-17-postgis-3
env:
  global:
  - PGPORT=5433
  - PGUSER=postgres
  - PGHOST=localhost
before_script:
  # 3. Version 17 usually starts on 5433 if another version is present. 
  # Let's force it to start and check the port.

  # 1. Stop the default service to free up port 5432
  - sudo service postgresql stop
  
  # 2. Create the cluster if it doesn't exist
  - sudo pg_createcluster 17 main -p $PGPORT --start || echo "Cluster already exists"
    
  # 4. Create your database
  - psql -c 'create database amenities;'
  #- psql -c 'create database amenities;'
  - psql -d amenities -c 'create extension postgis;'
  

script:
  # --check: doesn't reformat, just exits with error if code isn't "blackened"
  - black --check .
  # Runs the linter using the rules in your .flake8 file
  - flake8 .
  - coverage run -m pytest
  #- pytest --cov=./ --cov-report=xml
  - coverage report  # This prints the table in your Travis log
  - coverage xml     # This creates the file for Codecov

after_script:
  - coveralls --service=travis-pro


language: python
python:
  - "3.14"

before_install:
  - sudo apt-get update
  - sudo apt-get install -y gdal-bin libgdal-dev

install:
  - pip install -r requirements-dev.txt

script:
  - pytest --cov=./ --cov-report=xml

deploy:
  provider: elasticbeanstalk
  edge: true
  access_key_id: $AWS_ACCESS_KEY
  secret_access_key: $AWS_SECRET_KEY
  region: "us-east-2"
  app: "Nycnow-user"
  env: "Nycnow-user-env"
  bucket_name: "elasticbeanstalk-us-east-2-793314585930"
  #bucket_path: "/"
  zip_file: "django_map.zip"
  on:
    branch: develop  # This allows the 'develop' branch to deploy

after_success:
  - pip install codecov
  - codecov # This command automatically looks for the $CODECOV_TOKEN variable
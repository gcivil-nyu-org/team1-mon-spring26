language: python
python:
  - "3.12"

before_install:
  # 1. Add the official PostgreSQL repository
  - sudo apt install -y postgresql-common ca-certificates
  - echo | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh || true
  - sudo apt-get update
  
  # 2. Install version 17
  - sudo apt-get install -y postgresql-17 postgresql-client-17 postgresql-contrib-17 postgis postgresql-17-postgis-3

install:
  - pip install -r requirements-dev.txt

services:
  - postgresql
addons:
  postgresql: "17"
env:
  global:
  - PGPORT=5433
  - PGUSER=postgres
  - PGHOST=localhost
before_script:
  # 3. Version 17 usually starts on 5433 if another version is present. 
  # Let's force it to start and check the port.
  - sudo pg_ctlcluster 17 main start
  - pg_lsclusters
  
  # 4. Create your database
  - psql -c 'create database amenities;'
  #- psql -c 'create database amenities;'
  - psql -d amenities -c 'create extension postgis;'
  

script:
  # --check: doesn't reformat, just exits with error if code isn't "blackened"
  - black --check .
  # Runs the linter using the rules in your .flake8 file
  - flake8 .
  - coverage run -m pytest
  #- pytest --cov=./ --cov-report=xml
  - coverage report  # This prints the table in your Travis log
  - coverage xml     # This creates the file for Codecov

after_script:
  - coveralls --service=travis-pro


name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: feature
    # 1. Required permissions for OIDC to work
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 2. Use the ARN of the GitHub Actions role from your Terraform
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/NycNow-GitHub-Actions-SSM-Role
          aws-region: us-east-2
          disable-retry: true

      - name: Deploy via AWS Systems Manager (SSM)
        run: |
          # 3. Capture the Command ID to track success/failure
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:App,Values=NycNow" "Key=tag:Environment,Values=${{ vars.APP_ENV || 'feature' }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying latest application code" \
            --parameters 'commands=[
              "su - ec2-user -c \"cd /home/ec2-user/app && if [ ! -d .git ]; then git init && git remote add origin https://github.com/${{ github.repository }}.git; fi && git fetch && git reset --hard origin/${{ github.ref_name }}\"",
              "su - ec2-user -c \"cd /home/ec2-user/app && if [ ! -d venv ]; then python3 -m venv venv; fi\"",
              "su - ec2-user -c \"cd /home/ec2-user/app && source venv/bin/activate && pip install -r requirements.txt\"",
              "su - ec2-user -c \"cd /home/ec2-user/app && source venv/bin/activate && python manage.py collectstatic --noinput\"",
              "su - ec2-user -c \"cd /home/ec2-user/app && source venv/bin/activate && python manage.py migrate\"",
              "su - ec2-user -c \"aws ssm get-parameter --name '/nycnow/env/${{ vars.APP_ENV || 'feature' }}' --with-decryption --query 'Parameter.Value' --output text --region us-east-2 > /home/ec2-user/app/.env\"",
              "sudo bash /home/ec2-user/app/scripts/configure_pgbouncer.sh",
              "sudo systemctl enable pgbouncer",
              "sudo systemctl restart django-wsgi django-asgi nginx pgbouncer"
            ]' \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Command Sent: $COMMAND_ID"
          
          # Optional: Wait for the command to finish so GitHub shows success/fail accurately
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id $(aws ec2 describe-instances --filters "Name=tag:App,Values=NycNow" "Name=tag:Environment,Values=${{ vars.APP_ENV || 'feature' }}" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)

name: Deploy to EC2

on:
  push:
    branches:
      - develop
  repository_dispatch:
    types: [asg_instance_refresh]
jobs:
  tests:
    runs-on: ubuntu-latest
    # Skip tests if the trigger is the ASG Lambda (repository_dispatch)
    if: github.repository_owner == 'ajslezak' && github.event_name != 'repository_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Matches your EC2 environment

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Migrations (Optional/Headless)
        run: python manage.py migrate --noinput
        env:
          # Use a dummy DB or sqlite for CI tests to avoid "Connection Refused"
          DATABASE_URL: sqlite:///:memory:
          DJANGO_DEBUG: 'True'

      - name: Run Tests
        run: coverage run -m pytest

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    # This job must run if 'test' passes OR if 'tests' was skipped
    if: |
      always() && 
      github.repository_owner == 'ajslezak' && 
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    environment: feature
    # 1. Required permissions for OIDC to work
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 2. Use the ARN of the GitHub Actions role from your Terraform
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/NycNow-GitHub-Actions-SSM-Role
          aws-region: us-east-2
          disable-retry: false

      - name: Deploy via AWS Systems Manager (SSM)
        run: |
          # 1. Loop for up to 3 minutes checking for the tagged instance
          for i in {1..12}; do
            INSTANCE_EXISTS=$(aws ec2 describe-instances \
              --filters "Name=tag:App,Value=NycNow" "Name=instance-state-name,Value=running" \
              --query "Reservations[*].Instances[*].InstanceId" --output text)
            
            if [ ! -z "$INSTANCE_EXISTS" ]; then
              echo "Instance found: $INSTANCE_EXISTS"
              break
            fi
            echo "Waiting for instance to register tags... ($i/12)"
            sleep 15
          done
          # 2. Capture the Command ID to track success/failure
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:App,Values=NycNow" "Key=tag:Environment,Values=${{ vars.APP_ENV || 'feature' }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying latest application code" \
            --parameters 'commands=[
              "su - ec2-user -c \"cd /home/ec2-user/app && if [ ! -d .git ]; then git init && git remote add origin https://github.com/${{ github.repository }}.git; fi && git fetch && git reset --hard origin/${{ github.ref_name }}\"",
              "su - ec2-user -c \"cd /home/ec2-user/app && if [ ! -d venv ]; then python3.14 -m venv venv; fi\"",
              "su - ec2-user -c \"cd /home/ec2-user/app && source venv/bin/activate && pip install -r requirements.txt\"",
              "su - ec2-user -c \"cd /home/ec2-user/app && source venv/bin/activate && python manage.py collectstatic --noinput\"",
              "su - ec2-user -c \"aws ssm get-parameter --name '/nycnow/env/${{ vars.APP_ENV || 'feature' }}' --with-decryption --query 'Parameter.Value' --output text --region us-east-2 > /home/ec2-user/app/.env\"",
              "su - ec2-user -c \"cd /home/ec2-user/app && source venv/bin/activate && export $(cat /home/ec2-user/app/.env | xargs) && ./load_data.sh\"",
              "sudo chmod 711 /home/ec2-user",
              "sudo chcon -Rt httpd_sys_content_t /home/ec2-user/app/static || true",
              "sudo cp /home/ec2-user/app/https.conf /etc/nginx/nginx.conf",
              "sudo rm -rf /etc/nginx/conf.d/*",
              "sudo bash /home/ec2-user/app/scripts/configure_pgbouncer.sh",
              "sudo systemctl enable pgbouncer",
              "sudo systemctl restart django-wsgi django-asgi nginx pgbouncer"
            ]' \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Command Sent: $COMMAND_ID"
          
          # 3. Get the actual Instance ID that SSM matched (since we used tags)
          # We wait a few seconds to ensure SSM has registered the targets
          sleep 5
          TARGET_INSTANCE_ID=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --query "CommandInvocations[0].InstanceId" \
            --output text)

          if [ "$TARGET_INSTANCE_ID" == "None" ] || [ -z "$TARGET_INSTANCE_ID" ]; then
             echo "Error: SSM could not find any instances matching those tags."
             exit 1
          fi
          
          echo "Monitoring deployment on instance: $TARGET_INSTANCE_ID"

          # 4. Wait for completion
          STATUS="InProgress"
          while [ "$STATUS" == "InProgress" ]; do
            sleep 15
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "Current Status: $STATUS..."
          done

          # 5. Final Check & Error Logging
          if [ "$STATUS" == "Success" ]; then
            echo "Deployment successful!"
          else
            echo "Deployment failed with status: $STATUS"
            # Now $TARGET_INSTANCE_ID is valid and won't throw a ValidationException
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$TARGET_INSTANCE_ID" \
              --query "{STDOUT: StandardOutputContent, STDERR: StandardErrorContent}" \
              --output json
            exit 1
          fi
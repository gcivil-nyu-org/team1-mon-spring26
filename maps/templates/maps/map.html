{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{% static 'maps/favicon.svg' %}" type="image/svg+xml">
    <title>NYC Essentials Now!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="{% static 'maps/css/style.css' %}">
</head>
<body>

<nav class="topnav">
    <div class="topnav-brand">
        <span class="topnav-icon">🗽</span>
        <span class="topnav-name">NYC Essentials</span>
    </div>
    <div class="topnav-links">
        <a class="topnav-link active" href="#">Map</a>
    </div>
    <div class="topnav-right">
        <span class="loc-indicator" id="location-dot"></span>
        <span id="location-status" class="loc-status">Locating…</span>
        <span id="user-display" class="user-display" style="display:none"></span>
        <button class="btn-auth" id="auth-button">Login</button>
    </div>
</nav>

<div class="app">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="btn-icon" id="sidebar-toggle" title="Collapse sidebar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span class="sidebar-title">Filters</span>
        </div>
        <div class="sidebar-scroll">
            <div class="sb-section" style="position:relative;overflow:visible;">
                <div class="search-box">
                    <svg class="search-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="text" id="search-input" placeholder="Search address or place…" autocomplete="off">
                    <button id="search-clear" title="Clear">✕</button>
                </div>
                <div id="search-results" class="search-results"></div>
            </div>

            <div class="sb-section">
                <div class="sb-label">Show on map</div>
                <div id="amenity-list" class="amenity-list"></div>
            </div>

            <div class="sb-section" id="hours-filter-section" style="display:none;">
                <div class="sb-label">Hours &amp; Days</div>
                <div class="filter-scope-note">Restrooms only</div>
                <button class="open-now-btn" id="open-now-btn">
                    <span class="pulse-dot"></span>
                    Open Right Now
                </button>
                <div class="day-grid">
                    <div class="day-grid-label">Or pick days</div>
                    <div class="day-pills">
                        <button class="day-pill" data-day="1">Mon</button>
                        <button class="day-pill" data-day="2">Tue</button>
                        <button class="day-pill" data-day="3">Wed</button>
                        <button class="day-pill" data-day="4">Thu</button>
                        <button class="day-pill" data-day="5">Fri</button>
                        <button class="day-pill" data-day="6">Sat</button>
                        <button class="day-pill" data-day="0">Sun</button>
                    </div>
                </div>
                <div class="time-filter">
                    <div class="time-filter-header">
                        <span class="time-filter-title">Time window</span>
                        <button class="time-clear" id="time-clear">Clear</button>
                    </div>
                    <div class="time-display">
                        <span class="time-chip" id="time-from-label">12:00 AM</span>
                        <span class="time-arrow">→</span>
                        <span class="time-chip" id="time-to-label">11:59 PM</span>
                    </div>
                    <div class="range-track-wrap">
                        <div class="range-track-bg"></div>
                        <div class="range-track-fill" id="range-fill"></div>
                        <input type="range" class="range-slider range-from" id="time-from" min="0" max="1439" value="0" step="15">
                        <input type="range" class="range-slider range-to" id="time-to" min="0" max="1439" value="1439" step="15">
                    </div>
                    <div class="time-tick-labels">
                        <span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span>
                    </div>
                </div>
                <button class="reset-filters-btn" id="reset-filters-btn">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    Reset filters
                </button>
            </div>

            <div class="sb-section">
                <div class="sb-label">Options</div>
                <div class="options-list">
                    <label class="option-row">
                        <span class="option-label">Show inactive amenities</span>
                        <div class="pill-toggle">
                            <input type="checkbox" id="include-inactive" checked>
                            <span class="pill-thumb"></span>
                        </div>
                    </label>
                    <label class="option-row">
                        <span class="option-label">Accessible only</span>
                        <div class="pill-toggle">
                            <input type="checkbox" id="only-accessible">
                            <span class="pill-thumb"></span>
                        </div>
                    </label>
                </div>
            </div>
        </div>
    </aside>

    <main class="map-wrap">
        <div id="map"></div>
        <button class="btn-locate" id="location-button" title="Go to my location">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
        <div class="active-chips" id="filter-chips"></div>
    </main>

    <aside class="detail-panel" id="detail-panel">
        <div class="dp-header">
            <button class="dp-back" id="detail-close-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <div class="dp-title-wrap">
                <h2 class="dp-name" id="detail-name"></h2>
                <div class="dp-meta-row">
                    <span class="dp-badge" id="detail-type-badge"></span>
                </div>
            </div>
        </div>
        <nav class="dp-tabs">
            <button class="dp-tab active" data-tab="overview">Overview</button>
            <button class="dp-tab" data-tab="reviews">Reviews</button>
            <button class="dp-tab" data-tab="nearby">Nearby</button>
        </nav>
        <div class="dp-body">
            <div class="dp-tab-pane active" id="tab-overview"></div>
            <div class="dp-tab-pane" id="tab-reviews"></div>
            <div class="dp-tab-pane" id="tab-nearby"></div>
        </div>
    </aside>

</div>

<div id="auth-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <button id="auth-modal-close" class="modal-close">✕</button>
        <div class="modal-brand">🗽</div>
        <h3 class="modal-title" id="auth-modal-title">Welcome back</h3>
        <div class="auth-tabs">
            <button class="auth-tab-link active" data-tab="login-tab">Sign In</button>
            <button class="auth-tab-link" data-tab="register-tab">Create Account</button>
        </div>
        <div id="login-tab" class="auth-tab-content active">
            <form id="login-form">
                <p id="login-error" class="error-message" style="display:none;"></p>
                <input type="email" placeholder="Email address" required autocomplete="email">
                <input type="password" placeholder="Password" required autocomplete="current-password">
                <button type="submit" class="btn-primary">Sign In →</button>
            </form>
        </div>
        <div id="register-tab" class="auth-tab-content">
            <form id="register-form">
                <p id="register-error" class="error-message" style="display:none;"></p>
                <input type="email" placeholder="Email address" required autocomplete="email">
                <input type="password" placeholder="Password" required autocomplete="new-password">
                <button type="submit" class="btn-primary">Create Account →</button>
            </form>
        </div>
    </div>
</div>

<button class="btn-show-sidebar" id="sidebar-open-btn" title="Show filters" style="display:none">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    <span style="font-size:11px;font-weight:600;margin-left:4px">Filters</span>
</button>

<script src="{% static 'maps/js/map.js' %}" defer></script>
</body>
</html>

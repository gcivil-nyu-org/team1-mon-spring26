<nav class="topnav">
    <div class="topnav-brand">
        <span class="topnav-icon">🗽</span>
        <span class="topnav-name">NYC Essentials</span>
    </div>

    <div class="topnav-links">
        <a class="topnav-link{% if map_link_active %} active{% endif %}" href="{{ map_href|default:'/' }}">Map</a>
    </div>

    <div class="topnav-right">
        {% if show_location %}
            <span class="loc-indicator" id="location-dot"></span>
            <span id="location-status" class="loc-status">Locating…</span>
        {% endif %}

        {% if show_auth_button %}
            <button class="btn-auth" id="auth-button">Login</button>
        {% endif %}

        <div id="user-menu" class="user-menu"{% if hide_user_menu %} style="display:none"{% endif %}>
            <button id="avatar-button" class="avatar-button" type="button" aria-label="Open user menu">
                <img id="avatar-image" class="avatar-image" src="{{ avatar_src }}" alt="User avatar" onerror="this.onerror=null;this.src='/static/maps/default-avatar.svg';">
            </button>

            <div id="user-menu-dropdown" class="user-menu-dropdown" style="display:none;">
                <div id="user-menu-email" class="user-menu-email">{{ current_email|default:'' }}</div>
                <div class="user-menu-divider"></div>
                {% if show_profile_link %}
                    <a href="{% url 'maps:profile' %}">Profile</a>
                {% endif %}
                {% if show_settings_link %}
                    <a href="{% url 'maps:settings' %}">Settings</a>
                {% endif %}
                <button id="logout-link" type="button">Logout</button>
            </div>
        </div>
    </div>
</nav>

# Setup the cache zone for OSM tiles in standard /var/cache to avoid systemd PrivateTmp isolation
proxy_cache_path /var/cache/osm_tile_cache levels=1:2 keys_zone=osmtiles:30m max_size=3g inactive=7d use_temp_path=off;

server {
    listen 443 ssl;
    http2 on;
    server_name amenity.help;

    ssl_certificate      /etc/pki/tls/certs/server.crt;
    ssl_certificate_key  /etc/pki/tls/certs/server.key;

    ssl_session_timeout  5m;
    ssl_protocols  TLSv1.2 TLSv1.3;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_prefer_server_ciphers   on;

    location / {
        proxy_pass  http://127.0.0.1:8000; # Or whatever port your Django is on
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
    location /api/chats/events/ {
        proxy_pass  http://127.0.0.1:8000; # Or whatever port your Django is on
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection "";

        # for SSE chat updates
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }
    location /static/ {
        alias /var/app/current/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /tiles/ {
        # Proxy directly to OSM, stripping the /tiles/ prefix
        proxy_pass https://tile.openstreetmap.org/;
        proxy_ssl_server_name on;

        # Required by OSM usage policy: Custom User-Agent and correct Host
        proxy_set_header User-Agent "AmenityHelp/1.0 (contact@amenity.help)";
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Required by OSM usage policy: Cache for at least 7 days
        proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires Vary;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        
        proxy_cache osmtiles;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        
        # Tell Cloudflare and the user's browser to also cache for 7 days
        add_header Cache-Control "public, max-age=604800";
        add_header X-Cache-Status $upstream_cache_status;
    }
}
